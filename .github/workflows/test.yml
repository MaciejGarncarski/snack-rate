name: Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm --filter @snack-rate/app test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Pull Postgres image for Testcontainers
        run: docker pull postgres:19-alpine
      - run: pnpm --filter @snack-rate/app test:integration
