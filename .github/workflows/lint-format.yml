name: Lint and format code

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  checks:
    name: Formatting and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm --filter @snack-rate/app fmt:check
      - name: Check linting
        run: pnpm --filter @snack-rate/app lint
