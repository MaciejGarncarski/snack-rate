name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (optional; defaults to the selected ref head). No built image -> deploy will fail on pull."
        required: false
        type: string
  workflow_run:
    workflows: ["Build & Push"]
    branches: [development]
    types: [completed]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (development -> prod)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve SHA to deploy
        id: sha
        uses: actions/github-script@v7
        with:
          script: |
            let input;
            if (context.eventName === "workflow_dispatch") {
              input = (core.getInput("sha") || "").trim();
              if (!input) input = context.sha;
            } else {
              input = context.payload.workflow_run.head_sha;
            }
            let sha = input;
            if (!/^[0-9a-f]{40}$/.test(input)) {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: input,
              });
              sha = commit.sha;
            }
            core.setOutput("sha", sha);
            core.setOutput("tag", `sha-${sha.slice(0, 7)}`);

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: snack-rate-ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Add SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key

      - name: Run deploy script
        run: |
          IMAGE_TAG="${{ steps.sha.outputs.tag }}"
          echo "==> Deploying image tag: $IMAGE_TAG (full SHA: ${{ steps.sha.outputs.sha }})"
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_REPO_DIR }} && ./scripts/deploy.sh '$IMAGE_TAG'"
