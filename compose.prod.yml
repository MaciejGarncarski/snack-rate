services:
  garage:
    env_file:
      - .env.production

  postgres:
    env_file:
      - .env.production

  queue-worker:
    image: ghcr.io/maciejgarncarski/snack-rate/queue-worker:${IMAGE_TAG:-staging}
    # build:
    # context: .
    # dockerfile: tools/queue-worker/Dockerfile
    pull_policy: always
    env_file:
      - .env.production

  db-tool:
    image: ghcr.io/maciejgarncarski/snack-rate/db-tool:${IMAGE_TAG:-staging}
    pull_policy: always
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/maciejgarncarski/snack-rate:${IMAGE_TAG:-staging}
    # build:
    # context: .
    # dockerfile: Dockerfile
    restart: unless-stopped

    env_file:
      - .env.production

    depends_on:
      queue-worker:
        condition: service_started
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      alloy:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    env_file:
      - .env.production
    volumes:
      - /var/backups/snack-rate:/backups

  grafana:
    env_file:
      - .env.production

  caddy:
    image: caddy:2.11.4-alpine
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "${CADDY_HOST_HTTP_PORT:-80}:80"
      - "${CADDY_HOST_HTTPS_PORT:-443}:443"
      - "${CADDY_HOST_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./config/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  prometheus:
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts:/etc/prometheus/alerts:ro
