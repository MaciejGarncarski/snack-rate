services:
  garage:
    env_file:
      - .env.production

  postgres:
    env_file:
      - .env.production

  queue-worker:
    image: ghcr.io/maciejgarncarski/snack-rate/queue-worker:${IMAGE_TAG:-staging}
    # build:
    #   context: .
    #   dockerfile: tools/queue-worker/Dockerfile
    pull_policy: always
    env_file:
      - .env.production

  db-tool:
    build:
      context: .
      dockerfile: tools/db-tool/Dockerfile
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    # Use staging image for early iteration and testing, replace with production image when ready
    image: ghcr.io/maciejgarncarski/snack-rate:${IMAGE_TAG:-staging}
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped

    volumes:
      - pnpm_store:/pnpm/store

    env_file:
      - .env.production

    depends_on:
      queue-worker:
        condition: service_started
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      alloy:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${APP_PORT:-3000}/health/ready >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    env_file:
      - .env.production
    volumes:
      - /var/backups/snack-rate:/backups

  grafana:
    env_file:
      - .env.production

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "${CADDY_HOST_HTTP_PORT:-80}:80"
      - "${CADDY_HOST_HTTPS_PORT:-443}:443"
      - "${CADDY_HOST_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./config/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  prometheus:
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts:/etc/prometheus/alerts:ro
