services:
  garage:
    env_file:
      - .env.production
    networks:
      default: null
      edge:
        aliases:
          - prod-garage

  garage-init:
    env_file:
      - .env.production

  postgres:
    env_file:
      - .env.production

  db-tool:
    volumes:
      - pnpm_store:/pnpm/store

    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
    command:
      - pnpm run db:migrate && pnpm run db:seed-prod
    restart: "no"
    stdin_open: true
    tty: true

  app:
    image: ghcr.io/maciejgarncarski/snack-rate:latest
    restart: unless-stopped

    volumes:
      - pnpm_store:/pnpm/store

    env_file:
      - .env.production

    depends_on:
      db-tool:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      alloy:
        condition: service_started

    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      default: null
      edge:
        aliases:
          - prod-app

  grafana:
    env_file:
      - .env.production

    networks:
      default: null
      edge:
        aliases:
          - prod-grafana

  prometheus:
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts:/etc/prometheus/alerts:ro

networks:
  edge:
    name: snack-rate-edge
    external: true
