global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts/*.rules.yml
# NOTE: no Alertmanager is deployed. Rules above are evaluated by Prometheus
# (visible as FIRING/PENDING in the Prometheus UI and queryable via API).
# Email notifications are handled by Grafana unified alerting — see
# grafana/provisioning/alerting/ (contact point + provisioned rule group).
scrape_configs:
  # NOTE: the app is scraped by Alloy (config/alloy-config.alloy) and
  # forwarded via remote_write — do not add a direct app job here,
  # it would duplicate every series.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
