groups:
  - name: snack-rate-app
    interval: 1m
    rules:
      # ---------------------------------------------------------------
      # App Down — all /metrics targets stopped reporting to Prometheus
      # Alloy scrapes TWO targets for this job (app:9464 for
      # prod/staging, host.docker.internal:9464 for `pnpm dev`).
      # Exactly one is expected to be down at any time, so per-instance
      # `up == 0` always fires. Aggregate instead and only fire when
      # NO target is up. `or on() vector(0)` also covers the case where
      # the series is entirely absent (no scrape ever succeeded).
      # ---------------------------------------------------------------
      - alert: AppDown
        expr: |
          (sum(up{job="snack_rate_app"}) or on() vector(0)) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Snack Rate app is down"
          description: "No snack_rate_app target is up (all targets down for more than 2 minutes)."

      # ---------------------------------------------------------------
      # 5xx errors — share of failed responses over total requests
      # Mirrors the "Error %" panel on the SLO dashboard
      # ---------------------------------------------------------------
      - alert: High5xxRate
        expr: |
          ((100 * sum(rate(http_status_codes_total{http_status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m]))) or on() vector(0)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on Snack Rate app"
          description: '{{ printf "%.1f" $value }}% of responses are 5xx over the last 5 minutes (threshold: 5%).'

      # ---------------------------------------------------------------
      # Latency — p95 request duration above 1s
      # Mirrors the "p95 Latency" panel on the SLO dashboard
      # ---------------------------------------------------------------
      - alert: HighP95Latency
        expr: |
          (histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le)) or on() vector(0)) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on Snack Rate app"
          description: 'p95 latency is {{ printf "%.0f" $value }}ms over the last 5 minutes (threshold: 1000ms).'

      # ---------------------------------------------------------------
      # Readiness — dependency (DB/S3) checks failing at runtime
      # Mirrors the "Readiness Failures" panel on the Health dashboard
      # ---------------------------------------------------------------
      - alert: ReadinessFailures
        expr: |
          (sum(increase(readiness_failures_total[15m])) or on() vector(0)) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Snack Rate readiness checks failing"
          description: "{{ $value }} readiness failure(s) in the last 15 minutes. Check DB/S3 connectivity."
