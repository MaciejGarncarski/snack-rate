apiVersion: 1

# Grafana-managed alert rules for the Snack Rate app.
# These mirror config/alerts/snack-rate-app.rules.yml (evaluated by Prometheus)
# but fire through Grafana unified alerting so they reach the
# "Snack Rate Email" contact point defined in alerting.yml.
# The default notification policy (no matchers) routes all of these to email.
groups:
  - orgId: 1
    name: snack-rate-app
    folder: Snack Rate
    interval: 1m
    rules:
      - uid: snack-rate-app-down
        title: AppDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Alloy scrapes TWO targets for this job (app:9464 and
              # host.docker.internal:9464); exactly one is down per
              # environment by design. Aggregate so we only fire when NO
              # target is up. `or on() vector(0)` covers fully-absent series.
              expr: sum(up{job="snack_rate_app"}) or on() vector(0)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # NoData = healthy (no series, e.g. app never scraped in window).
        # KeepLast on error avoids email spam during Prometheus restarts.
        noDataState: OK
        execErrState: KeepLast
        for: 2m
        annotations:
          summary: "Snack Rate app is down"
          description: "No snack_rate_app target is up (all targets down for more than 2 minutes)."
        labels:
          severity: critical
        isPaused: false

      - uid: snack-rate-high-5xx-rate
        title: High5xxRate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # `or on() vector(0)` maps "no traffic in window" to 0 (healthy)
              # instead of NoData, so idle periods don't email.
              expr: >-
                (100 * sum(rate(http_status_codes_total{http_status_code=~"5.."}[5m]))
                / sum(rate(http_requests_total[5m])) or on() vector(0))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: "High 5xx rate on Snack Rate app"
          description: "More than 5% of responses are 5xx over the last 5 minutes."
        labels:
          severity: warning
        isPaused: false

      - uid: snack-rate-high-p95-latency
        title: HighP95Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                (histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le)) or on() vector(0))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: "High p95 latency on Snack Rate app"
          description: "p95 latency is above 1000ms over the last 5 minutes."
        labels:
          severity: warning
        isPaused: false

      - uid: snack-rate-readiness-failures
        title: ReadinessFailures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum(increase(readiness_failures_total[15m])) or on() vector(0))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: "Snack Rate readiness checks failing"
          description: "Readiness failures in the last 15 minutes. Check DB/S3 connectivity."
        labels:
          severity: warning
        isPaused: false
