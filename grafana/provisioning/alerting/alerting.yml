apiVersion: 1

contactPoints:
  - orgId: 1
    name: Snack Rate Email
    receivers:
      - uid: snack-rate-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $GF_SMTP_USER
          singleEmail: true

policies:
  - orgId: 1
    receiver: Snack Rate Email
    # Batch alerts by name instead of every label (`["..."]` sent one email
    # per instance / per DatasourceNoData group). Timings throttle repeats.
    group_by: ["alertname", "grafana_folder"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
