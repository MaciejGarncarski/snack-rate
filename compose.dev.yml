services:
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.development.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts:/etc/prometheus/alerts:ro
  grafana:
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3001/
    ports:
      - "3001:3000"
  tempo:
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
  loki:
    ports:
      - "127.0.0.1:3100:3100"
  postgres:
    ports:
      - "5432:5432"
