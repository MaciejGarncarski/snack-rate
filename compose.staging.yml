services:
  garage:
    env_file:
      - .env.staging

  postgres:
    env_file:
      - .env.staging

  queue-worker:
    image: ghcr.io/maciejgarncarski/snack-rate/queue-worker:${IMAGE_TAG:-staging}
    pull_policy: always
    env_file:
      - .env.staging

  db-tool:
    build:
      context: .
      dockerfile: tools/db-tool/Dockerfile
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/maciejgarncarski/snack-rate:${IMAGE_TAG:-staging}
    restart: unless-stopped

    env_file:
      - .env.staging

    depends_on:
      queue-worker:
        condition: service_started
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      alloy:
        condition: service_started

    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT:-3000}/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    env_file:
      - .env.staging
    volumes:
      - /var/backups/snack-rate:/backups

  grafana:
    env_file:
      - .env.staging

  caddy:
    image: caddy:2.11.4-alpine
    env_file:
      - .env.staging
    restart: unless-stopped
    ports:
      - "${CADDY_HOST_HTTP_PORT:-8080}:80"
      - "${CADDY_HOST_HTTPS_PORT:-8443}:443"
      - "${CADDY_HOST_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./config/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  prometheus:
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts:/etc/prometheus/alerts:ro
