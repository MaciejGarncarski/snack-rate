services:
  postgres:
    env_file:
      - .env.staging
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    volumes:
      - pnpm_store:/pnpm/store

    env_file:
      - .env.staging

    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      alloy:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      default: null
      edge:
        aliases:
          - staging-app

  grafana:
    env_file:
      - .env.staging
    environment:
      GF_SERVER_ROOT_URL: "https://${APP_DOMAIN}/grafana/"

    networks:
      default: null
      edge:
        aliases:
          - staging-grafana

  prometheus:
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts:/etc/prometheus/alerts:ro

networks:
  edge:
    name: snack-rate-edge
    external: true
