services:
  garage:
    env_file:
      - .env.staging

  garage-init:
    env_file:
      - .env.staging

  postgres:
    env_file:
      - .env.staging

  db-tool:
    volumes:
      - pnpm_store:/pnpm/store

    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
    command:
      - pnpm run db:migrate && pnpm run db:seed-prod
    restart: "no"
    stdin_open: true
    tty: true

  app:
    image: ghcr.io/maciejgarncarski/snack-rate:staging
    restart: unless-stopped

    volumes:
      - pnpm_store:/pnpm/store

    env_file:
      - .env.staging

    depends_on:
      db-tool:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      alloy:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${APP_PORT:-3000}/health/ready >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    env_file:
      - .env.staging

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.staging
    restart: unless-stopped
    ports:
      - "${CADDY_HOST_HTTP_PORT:-8080}:80"
      - "${CADDY_HOST_HTTPS_PORT:-8443}:443"
      - "${CADDY_HOST_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./config/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  prometheus:
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts:/etc/prometheus/alerts:ro
