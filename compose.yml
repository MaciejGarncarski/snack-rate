services:
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command:
      - /garage
      - server
      - --single-node

    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml

    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  garage-init:
    image: alpine:3.24
    depends_on:
      garage:
        condition: service_started
    network_mode: service:garage
    pid: service:garage
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        chroot /proc/1/root /garage key import -n snackrate-app "$S3_ACCESS_KEY" "$S3_SECRET_KEY" --yes || true

        chroot /proc/1/root /garage bucket create "$S3_BUCKET_UPLOADS" || true
        chroot /proc/1/root /garage bucket create "$S3_BUCKET_PUBLIC" || true

        chroot /proc/1/root /garage bucket allow "$S3_BUCKET_UPLOADS" \
          --key "$S3_ACCESS_KEY" \
          --read --write --owner || true

        chroot /proc/1/root /garage bucket allow "$S3_BUCKET_PUBLIC" \
          --read --anonymous || true

        chroot /proc/1/root /garage bucket allow "$S3_BUCKET_PUBLIC" \
          --key "$S3_ACCESS_KEY" \
          --read --write --owner || true

        echo "Garage buckets configured (uploads private, public bucket exposed)."
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-snackrate-app}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-snack-rate-uploads}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-snack-rate-public}
    restart: "on-failure:3"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    shm_size: 256mb

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver

    volumes:
      - prometheus_data:/prometheus

    healthcheck:
      test:
        ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      node-exporter:
        condition: service_healthy

  tempo:
    image: grafana/tempo:3.0.0
    restart: unless-stopped

    command:
      - -config.file=/etc/tempo.yml

    volumes:
      - ./config/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.7.2
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/loki.yml

    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.16.1
    restart: unless-stopped

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/alloy-config.alloy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./config/alloy-config.alloy:/etc/alloy/alloy-config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1
    restart: unless-stopped

    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --no-collector.netstat
      - --no-collector.softnet
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|squashfs|sysfs|tmpfs|tracefs|9p)$

    pid: host

    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 -O - http://localhost:9100/metrics >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.0.1
    restart: unless-stopped

    environment:
      GF_SERVER_DOMAIN: "${GRAFANA_DOMAIN}"
      GF_SERVER_ROOT_URL: "${GRAFANA_SERVER_ROOT_URL}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_INITIAL_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_INITIAL_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${GRAFANA_SMTP}"
      GF_SMTP_USER: "${GRAFANA_SMTP_USER}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_FROM_ADDRESS}"
      GF_SMTP_FROM_NAME: "Grafana Alerts"
      GF_SMTP_STARTTLS_POLICY: "OpportunisticStartTLS"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  garage_meta:
  garage_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  caddy_data:
  caddy_config:
  pnpm_store:
