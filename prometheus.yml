global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      scheme: http
      timeout: 10s
      api_version: v2
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: tanstack-app
    static_configs:
      - targets: ["host.docker.internal:9464"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
