packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true
autoDedupe: true
catalog:
  "@aws-sdk/client-s3": ^3.1154.0
  "@aws-sdk/lib-storage": ^3.1154.0
  dotenv: "^17.3.1"
  drizzle-kit: "1.0.0-rc.4"
  drizzle-orm: "1.0.0-rc.4"
  drizzle-seed: "1.0.0-rc.4"
  nanoid: "5.1.15"
  p-retry: ^8.0.1
  pg: ^8.23.1
  pg-boss: ^12.38.0
  pino: ^10.4.0
  tsx: ^4.23.15
  typescript: ~7.0.2
  zod: ^4.6.7
  sharp: ^0.35.5
  uuidv7: "^1.2.1"
  react: "^19.3.0"
  react-dom: "^19.3.0"
  "@types/node": ^26.6.5
  "@types/pg": "^8.23.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": ^19.3.0

minimumReleaseAge: 1440
blockExoticSubdeps: true
allowBuilds:
  argon2: false
  cpu-features: false
  electron: false
  esbuild: true
  lefthook: true
  lightningcss: true
  msw: false
  protobufjs: false
  sharp: false
  ssh2: false
minimumReleaseAgeExclude:
  - "@shadcn/lint@0.1.0"
  - '@tanstack/react-router@1.170.44'
  - '@tanstack/react-start-client@1.168.42'
  - '@tanstack/react-start-rsc@0.1.62'
  - '@tanstack/react-start-server@1.167.49'
  - '@tanstack/react-start@1.169.1'
  - '@tanstack/router-core@1.171.37'
  - '@tanstack/router-generator@1.167.43'
  - '@tanstack/router-plugin@1.168.45'
  - '@tanstack/start-client-core@1.170.37'
  - '@tanstack/start-plugin-core@1.171.52'
  - '@tanstack/start-server-core@1.169.42'
  - '@tanstack/start-storage-context@1.167.39'
