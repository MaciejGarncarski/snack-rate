packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true

catalog:
  "@aws-sdk/client-s3": "^3.1066.0"
  "@aws-sdk/lib-storage": "^3.1066.0"
  dotenv: "^17.3.1"
  drizzle-kit: "1.0.0-rc.4"
  drizzle-orm: "1.0.0-rc.4"
  drizzle-seed: "1.0.0-rc.4"
  nanoid: "5.1.15"
  p-retry: "^8.0.0"
  pg: "^8.22.0"
  pg-boss: "^12.26.0"
  pino: "^10.3.1"
  tsx: "^4.22.4"

minimumReleaseAge: 1440
blockExoticSubdeps: true
allowBuilds:
  argon2: false
  cpu-features: false
  electron: false
  esbuild: true
  lefthook: true
  lightningcss: true
  msw: false
  protobufjs: false
  sharp: false
  ssh2: false
minimumReleaseAgeExclude:
  - "@storybook/addon-a11y@10.5.4"
  - "@storybook/addon-docs@10.5.4"
  - "@storybook/addon-onboarding@10.5.4"
  - "@storybook/addon-vitest@10.5.4"
  - "@storybook/builder-vite@10.5.4"
  - "@storybook/csf-plugin@10.5.4"
  - "@storybook/react-dom-shim@10.5.4"
  - "@storybook/react-vite@10.5.4"
  - "@storybook/react@10.5.4"
  - "@storybook/tanstack-react@10.5.4"
  - "@storybook/cli@10.5.4"
  - "@storybook/addon-themes@10.5.4"
  - storybook@10.5.4
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - playwright-core@1.62.1
  - playwright@1.62.1
