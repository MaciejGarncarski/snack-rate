packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true

catalog:
  "@aws-sdk/client-s3": "^3.1113.0"
  "@aws-sdk/lib-storage": "^3.1113.0"
  dotenv: "^17.3.1"
  drizzle-kit: "1.0.0-rc.4"
  drizzle-orm: "1.0.0-rc.4"
  drizzle-seed: "1.0.0-rc.4"
  nanoid: "5.1.15"
  p-retry: "^8.0.0"
  pg: "^8.23.0"
  pg-boss: "^12.27.0"
  pino: "^10.3.1"
  tsx: "^4.23.12"
  zod: "^4.5.1"
  uuidv7: "^1.2.1"
  "@types/node": "^26.2.0"
  "@types/pg": "^8.23.1"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.4"

minimumReleaseAge: 1440
blockExoticSubdeps: true
allowBuilds:
  argon2: false
  cpu-features: false
  electron: false
  esbuild: true
  lefthook: true
  lightningcss: true
  msw: false
  protobufjs: false
  sharp: false
  ssh2: false
minimumReleaseAgeExclude:
  - zod@4.5.1
  - '@vitest/browser-playwright@5.0.0'
  - '@vitest/browser@5.0.0'
  - '@vitest/coverage-v8@5.0.0'
  - '@vitest/mocker@5.0.0'
  - '@vitest/pretty-format@5.0.0'
  - '@vitest/spy@5.0.0'
  - '@vitest/ui@5.0.0'
  - '@vitest/utils@5.0.0'
  - vitest@5.0.0
  - db0@0.4.1
  - h3@2.0.1-rc.31
  - nitro@3.0.260903-beta
  - srvx@1.0.3
  - unstorage@2.0.0-alpha.10
