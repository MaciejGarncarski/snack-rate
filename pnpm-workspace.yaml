packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true

catalog:
  "@aws-sdk/client-s3": ^3.1127.0
  "@aws-sdk/lib-storage": ^3.1127.0
  dotenv: "^17.3.1"
  drizzle-kit: "1.0.0-rc.4"
  drizzle-orm: "1.0.0-rc.4"
  drizzle-seed: "1.0.0-rc.4"
  nanoid: "5.1.15"
  p-retry: ^8.0.1
  pg: "^8.23.0"
  pg-boss: ^12.30.0
  pino: "^10.3.1"
  tsx: ^4.23.13
  zod: ^4.5.4
  uuidv7: "^1.2.1"
  "@types/node": ^26.4.1
  "@types/pg": "^8.23.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": ^19.3.0

minimumReleaseAge: 1440
blockExoticSubdeps: true
allowBuilds:
  argon2: false
  cpu-features: false
  electron: false
  esbuild: true
  lefthook: true
  lightningcss: true
  msw: false
  protobufjs: false
  sharp: false
  ssh2: false
minimumReleaseAgeExclude:
  - "@types/react-dom@19.3.0"
  - "@types/react@19.3.0"
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
