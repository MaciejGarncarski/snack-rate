packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true

catalog:
  "@aws-sdk/client-s3": "^3.1113.0"
  "@aws-sdk/lib-storage": "^3.1113.0"
  dotenv: "^17.3.1"
  drizzle-kit: "1.0.0-rc.5-ab785fc"
  drizzle-orm: "1.0.0-rc.5-ab785fc"
  drizzle-seed: "1.0.0-rc.5-ab785fc"
  nanoid: "5.1.15"
  p-retry: "^8.0.0"
  pg: "^8.23.0"
  pg-boss: "^12.27.0"
  pino: "^10.3.1"
  tsx: "^4.23.12"
  "@types/node": "^26.2.0"
  "@types/pg": "^8.23.1"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.4"

minimumReleaseAge: 1440
blockExoticSubdeps: true
allowBuilds:
  argon2: false
  cpu-features: false
  electron: false
  esbuild: true
  lefthook: true
  lightningcss: true
  msw: false
  protobufjs: false
  sharp: false
  ssh2: false
